[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-provider-openai-chat"
version = "1.0.0"
description = "OpenAI-compatible Chat Completions and Azure OpenAI provider plugins for BanyanOS llm_engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "ideabosque" },
]
dependencies = [
    "silvaengine_utility",
    "llm-provider-base>=1.0,<2",
    "openai>=1.40,<2",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff>=0.6",
]

[project.entry-points."banyan.llm_providers"]
openai-completions = "llm_provider_openai_chat:OpenAIChatProvider"
azure-openai = "llm_provider_openai_chat:AzureOpenAIChatProvider"

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_provider_openai_chat*"]

[tool.setuptools.package-data]
llm_provider_openai_chat = ["*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"]
